org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# All dependencies are AndroidX. Jetifier only transforms the large Flutter
# engine debug jars and exhausts the Gradle heap on CI.
android.enableJetifier=false
