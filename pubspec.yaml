name: dot_music
description: "Flutter-плеер музыки с локальной медиатекой, плейлистами и статистикой."


version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  logger: ^2.6.1
  on_audio_query: ^2.9.0
  go_router: ^16.2.1
  just_audio: ^0.9.35
  shared_preferences: ^2.2.2
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  audio_service: ^0.18.18
  permission_handler: ^11.0.1
  # Нужен как runtime-зависимость: tree-shaker иконок проверяет его шрифт
  # даже если приложение использует только MaterialIcons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.3.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.3

flutter:

  uses-material-design: true
  generate: true

assets:
  - assets/dot_music.png
  - assets/dot_music_logo.png

flutter_native_splash:
  color: "#ffffff" 
  image: assets/dot_music.png 
  android: true 
  ios: true 
  fullscreen: true 

flutter_launcher_icons:
  android: "dot_music" 
  ios: true 
  image_path: "assets/dot_music_logo.png" 
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/dot_music_logo.png" 
